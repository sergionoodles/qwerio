[package]
name = "qwerio-sqlite"
description = "SQLite adapter: file opening, metadata, dialect SQL, worker lifecycle, sessions, and interruption."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.89"
qwerio-core.workspace = true
# Bundled SQLite gives every platform the same engine version and features
# (NULLS FIRST/LAST, pragma table-valued functions, error offsets).
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype", "hooks"] }
tokio = { version = "1.48", default-features = false, features = ["sync"] }

[dev-dependencies]
qwerio-core = { workspace = true, features = ["contract-tests"] }
tempfile = "3.23"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
