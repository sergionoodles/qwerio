[package]
name = "qwerio-app"
description = "Application services: use cases, sessions, navigation, background work, and machine-local state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qwerio-core.workspace = true
qwerio-workspace.workspace = true
# The application's own state database, separate from user databases.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48", default-features = false, features = ["sync"] }

[dev-dependencies]
qwerio-sqlite.workspace = true
tempfile = "3.23"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
