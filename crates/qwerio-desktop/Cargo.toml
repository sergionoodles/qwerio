[package]
name = "qwerio-desktop"
description = "Qwerio desktop application: startup, GPUI views, themes, and OS integration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "qwerio"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false }
directories = "6.0"
gpui-kit = { workspace = true, features = ["tree-sitter-sql", "tree-sitter-markdown"] }
gpui-tui = { git = "https://github.com/sergionoodles/gpui-tui", tag = "v0.2.0", optional = true }
keyring = "4.2"
notify = "8.2"
qwerio-app.workspace = true
qwerio-core.workspace = true
qwerio-postgres.workspace = true
qwerio-mysql.workspace = true
qwerio-sqlite.workspace = true
qwerio-workspace.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48", features = ["rt-multi-thread", "sync"] }
toml = "1.1"

[dev-dependencies]
# Headless UI tests; dev-only, so release builds never include test support.
gpui-kit = { workspace = true, features = ["test-support"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.23"

[lints]
workspace = true

[features]
# Run inside a kitty-compatible terminal with `qwerio --tui`.
tui = ["dep:gpui-tui"]
